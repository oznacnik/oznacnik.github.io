<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 794 1123" width="794" height="1123">
  <rect width="794" height="1123" fill="#FFFFFF"/>
  
  <rect y="0" width="794" height="8" fill="#E3000B"/>

  <text x="36" y="72" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="9" font-weight="400" fill="#888888" letter-spacing="2.4" text-decoration="none" text-anchor="start">GALERIE OZNAČNÍK — PRAHA — 2026</text>
  <text x="32" y="176" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="110" font-weight="700" fill="#000000" letter-spacing="-4" text-decoration="none" text-anchor="start">PŘI</text>
  <text x="32" y="276" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="110" font-weight="700" fill="#E3000B" letter-spacing="-4" text-decoration="none" text-anchor="start">JATO.</text>

  <rect y="298" width="794" height="6" fill="#000000"/>

  <rect y="304" width="794" height="92" fill="#000000"/>
  <text x="36" y="340" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#FFFFFF" letter-spacing="-0.4" text-decoration="none" text-anchor="start">Děkujeme za přihlášku.</text>
  <text x="36" y="370" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#E3000B" letter-spacing="-0.4" text-decoration="none" text-anchor="start">Jsi v programu kolektivní výstavy.</text>

  <rect y="396" width="794" height="6" fill="#000000"/>

  <text x="36" y="424" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="8" font-weight="700" fill="#888888" letter-spacing="2.4" text-decoration="none" text-anchor="start">CO BUDE NÁSLEDOVAT</text>
  <text x="36" y="446" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#333333" letter-spacing="0" text-decoration="none" text-anchor="start">Tři kroky, které tě čekají. Detaily k podmínkám, formátu a vernisáži</text>
  <text x="36" y="463" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#333333" letter-spacing="0" text-decoration="none" text-anchor="start">jsou na další straně. Odkaz na formulář a deadline na poslední.</text>

  <line x1="0" y1="488" x2="794" y2="488" stroke="#000000" stroke-width="2"/>
  <line x1="70" y1="488" x2="70" y2="570" stroke="#000000" stroke-width="2"/>
  <text x="36" y="526" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#E3000B" letter-spacing="-1.2" text-decoration="none" text-anchor="start">01</text>
  <text x="84" y="514" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#000000" letter-spacing="1.6" text-decoration="none" text-anchor="start">VYPLŇ FORMULÁŘ</text>
  <text x="84" y="536" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#333333" letter-spacing="0" text-decoration="none" text-anchor="start">Odkaz na další straně. Zabere ti to 5 minut. Bez vyplnění tě</text>
  <text x="84" y="553" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#333333" letter-spacing="0" text-decoration="none" text-anchor="start">nezařadíme do plánu instalace.</text>

  <line x1="0" y1="570" x2="794" y2="570" stroke="#000000" stroke-width="2"/>
  <line x1="70" y1="570" x2="70" y2="652" stroke="#000000" stroke-width="2"/>
  <text x="36" y="608" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#E3000B" letter-spacing="-1.2" text-decoration="none" text-anchor="start">02</text>
  <text x="84" y="596" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#000000" letter-spacing="1.6" text-decoration="none" text-anchor="start">PŘIPRAV DÍLA</text>
  <text x="84" y="618" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#333333" letter-spacing="0" text-decoration="none" text-anchor="start">Formát A3, papír cca 220 g/m². Materiál si hradíš sám/sama.</text>
  <text x="84" y="635" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#333333" letter-spacing="0" text-decoration="none" text-anchor="start">Edice volné — jeden motiv může být ve více kopiích.</text>

  <line x1="0" y1="652" x2="794" y2="652" stroke="#000000" stroke-width="2"/>
  <line x1="70" y1="652" x2="70" y2="734" stroke="#000000" stroke-width="2"/>
  <text x="36" y="690" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#E3000B" letter-spacing="-1.2" text-decoration="none" text-anchor="start">03</text>
  <text x="84" y="678" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#000000" letter-spacing="1.6" text-decoration="none" text-anchor="start">DORAZÍŠ NA SPOLEČNOU INSTALACI</text>
  <text x="84" y="700" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#333333" letter-spacing="0" text-decoration="none" text-anchor="start">Termín víkend 23.–24. 5. 2026 (klidně oba dny). Sejdeme se,</text>
  <text x="84" y="717" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#333333" letter-spacing="0" text-decoration="none" text-anchor="start">projdeme trasu, každý si obsadí svou zastávku.</text>
<line x1="0" y1="734" x2="794" y2="734" stroke="#000000" stroke-width="2"/>

  <text x="36" y="758" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="8" font-weight="700" fill="#888888" letter-spacing="2.4" text-decoration="none" text-anchor="start">POZN. PTÁČKA</text>
  <text x="36" y="780" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#333333" letter-spacing="0" text-decoration="none" text-anchor="start">Tohle PDF je krátké schválně. Důležité věci jsou na další straně,</text>
  <text x="36" y="797" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#333333" letter-spacing="0" text-decoration="none" text-anchor="start">formulář na té poslední. Cokoliv — piš na e-mail.</text>

  <rect y="1095" width="794" height="6" fill="#000000"/>
  <text x="36" y="1096" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="8" font-weight="400" fill="#888888" letter-spacing="1.6" text-decoration="none" text-anchor="start">Strana 1 / 3 — Přijato</text>
  <text x="758" y="1096" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="8" font-weight="400" fill="#888888" letter-spacing="1.6" text-decoration="none" text-anchor="end">Galerie Označník — Praha</text>
  <rect y="1115" width="794" height="8" fill="#E3000B"/>
</svg>