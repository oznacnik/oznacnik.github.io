  <text x="36" y="300.24" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#000000" letter-spacing="2.4" text-decoration="none" text-anchor="start">GUERILLA. VLASTNÍ ZODPOVĚDNOST.</text>
  <text x="36" y="335.24" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#333333" letter-spacing="0" text-decoration="none" text-anchor="start">Je to guerilla. Neoficiální, bez financování.</text>
  <text x="36" y="354.24" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#333333" letter-spacing="0" text-decoration="none" text-anchor="start">Materiál si hradí každý sám.</text>
  <text x="36" y="373.24" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#333333" letter-spacing="0" text-decoration="none" text-anchor="start">Délku výstavy neurčujeme my, určuje ji DPP. Průměrná délka isntalace je týden.</text>

  <line x1="0" y1="395.24" x2="794" y2="395.24" stroke="#000000" stroke-width="3"/>
  <text x="36" y="463.24" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="56" font-weight="700" fill="#000000" letter-spacing="-2" text-decoration="none" text-anchor="start">ZASTÁVKA</text>
  <text x="36" y="480.76" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#000000" letter-spacing="2.4" text-decoration="none" text-anchor="start">1 ZASTÁVKA = 2 OZNAČNÍKY.</text>
  <text x="36" y="515.76" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#333333" letter-spacing="0" text-decoration="none" text-anchor="start">Tvůj výstavní prostor je zastávka. Označník je ten informační rámeček</text>
  <text x="36" y="534.76" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#333333" letter-spacing="0" text-decoration="none" text-anchor="start">na zastávce, do kterého instalujeme.</text>
  <text x="36" y="553.76" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#333333" letter-spacing="0" text-decoration="none" text-anchor="start">Jedna zastávka má dva označníky. Oba patří tobě.</text>
  <text x="36" y="572.76" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#333333" letter-spacing="0" text-decoration="none" text-anchor="start">Můžeš si v formuláři říct o víc zastávek. Pak máš odpovídajícím</text>
  <text x="36" y="591.76" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#333333" letter-spacing="0" text-decoration="none" text-anchor="start">způsobem víc označníků k zaplnění. Konkrétní zastávky přidělí algoritmus, který náhodně vybírá.</text>
